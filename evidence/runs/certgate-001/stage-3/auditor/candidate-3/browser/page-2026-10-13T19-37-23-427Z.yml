        - paragraph [ref=f1e23]:
          - text: "Every batch of steel arrives with a mill certificate. Someone in Quality checks it by hand against the purchase spec: different mills, different layouts, often scanned. CertGate puts every value next to the spec and its place in the document, and proposes release, block or review."
          - strong [ref=f1e24]: A person decides.
        - paragraph [ref=f1e25]:
          - text: "Where AMD fits: each certificate page is read, as an image, by the open model"
          - strong [ref=f1e26]: self-dploy/Qwen3.8-27B
          - text: (as reported by the endpoint), served by AMD Token Factory. The model only reads; it never explains or decides. GPU, ROCm and vLLM versions are not exposed by the endpoint, so none is claimed here.
